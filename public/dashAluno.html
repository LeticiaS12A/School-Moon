<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>School Moon | Dashboard</title>
    <link rel="stylesheet" href="./css/dashboards.css">
    <script src="../js/sessao.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body onload="obterDadosGrafico()">

<header>
    <h1>School Moon</h1>
    <p>Dashboard do Aluno</p>
</header>

<div class="container">
    <div class="titulo-dashboard">
        <h2>Olá, <span id="b_usuario">Aluno</span></h2>
        <p>Acompanhe seu progresso de estudos</p>
    </div>

    <section class="kpis">
        <div class="card-kpi">
            <h3>Progresso Geral</h3>
            <p id="kpi_progresso_geral">0%</p>
        </div>
        <div class="card-kpi">
            <h3>Cursos Iniciados</h3>
            <p id="kpi_cursos_iniciados">0</p>
        </div>
        <div class="card-kpi">
            <h3>Cursos Concluídos</h3>
            <p id="kpi_cursos_concluidos">0</p>
        </div>
    </section>

    <section class="graficos">
        <div class="grafico">
            <h3>Progresso por Curso</h3>
            <div id="container_barras">
            </div>
            <div class="graph" style="margin-top: 20px;">
                <canvas id="myChartCanvas"></canvas>
            </div>
        </div>

        <div class="grafico">
            <h3>Resumo</h3>
            <div class="lista">
                <div class="item-lista">
                    <span>Curso Mais Avançado</span>
                    <strong id="resumo_mais_avancado">-</strong>
                </div>
                <div class="item-lista">
                    <span>Data do Primeiro Acesso</span>
                    <strong id="resumo_data_inicio">-</strong>
                </div>
            </div>
        </div>
    </section>
</div>

<script>
    b_usuario.innerHTML = sessionStorage.NOME_USUARIO;
    var idUsuario = sessionStorage.ID_USUARIO;

    function obterDadosGrafico() {
        fetch(`/medidas/ultimas/${idUsuario}`, { cache: 'no-store' }).then(function (response) {
            if (response.ok) {
                response.json().then(function (resposta) {
                    console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);
                    plotarGrafico(resposta);
                    atualizarKPIs(resposta);
                });
            } else {
                console.error('Nenhum dado encontrado ou erro na API');
            }
        })
        .catch(function (error) {
            console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
        });
    }

    let proximoGrafico;

    function plotarGrafico(resposta) {
        let labels = [];
        let dadosProgresso = [];

        container_barras.innerHTML = "";

        for (i = 0; i < resposta.length; i++) {
            var registro = resposta[i];
            labels.push(registro.nome_curso);
            dadosProgresso.push(registro.progresso);

            container_barras.innerHTML += `
                <p>${registro.nome_curso}</p>
                <div class="barra-container">
                    <div class="barra" style="width: ${registro.progresso}%; background-color: #6c5ce7;"></div>
                </div>
            `;
        }

        if (proximoGrafico) {
            proximoGrafico.destroy();
        }

        const ctx = document.getElementById('myChartCanvas').getContext('2d');
        proximoGrafico = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Progresso %',
                    data: dadosProgresso,
                    backgroundColor: '#6c5ce7',
                    borderColor: '#a29bfe',
                    borderWidth: 1
                }]
            },
            options: { 
                scales: { 
                    y: { beginAtZero: true, max: 100 } 
                } 
            }
        });
    }

    function atualizarKPIs(resposta) {
        if (resposta.length == 0) return;

        let totalProgresso = 0;
        let concluidos = 0;
        let iniciados = 0;
        let maiorProgresso = -1;
        let cursoMaisAvancado = "";

        resposta.forEach(r => {
            totalProgresso += Number(r.progresso);
            if (r.status == 'Concluido' || r.progresso == 100) concluidos++;
            if (r.progresso > 0) iniciados++;
            
            if (r.progresso > maiorProgresso) {
                maiorProgresso = r.progresso;
                cursoMaisAvancado = r.nome_curso;
            }
        });

        kpi_progresso_geral.innerHTML = `${(totalProgresso / resposta.length).toFixed(0)}%`;
        kpi_cursos_iniciados.innerHTML = iniciados;
        kpi_cursos_concluidos.innerHTML = concluidos;
        resumo_mais_avancado.innerHTML = cursoMaisAvancado || "Nenhum";
        resumo_data_inicio.innerHTML = resposta[0].dt_inicio || "Sem data"; 
    }
</script>
</body>
</html>
