<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Moon</title>

    <script src="./js/sessao.js"></script>

    <link rel="stylesheet" href="./css/estilo.css">
    <link rel="icon" href="./assets/icon/favicon2.ico">
    <link rel="preconnect" href="https://fonts.gstatic.com">
</head>
<body>
    <header>
        <div class="container-header">
            <div>
                <p class="titulo-projeto">School Moon</p>
            </div>
            <nav class="btn-navs">
                <a href="index.html" class="navs-acesso">Inicial</a>
                <a href="cursos.html" class="navs-acesso">Cursos</a>
                <a href="#" class="acesso-atual">Progresso</a>
            </nav>
        </div>
    </header>

    <div className="space-y-4 mb-8">
        <div className="relative max-w-md">
          <Search className="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-muted-foreground" />
          <Input
            placeholder="Buscar cursos..."
            value={search}
            className="pl-10 rounded-xl bg-card"
          />
        </div>

        <div className="flex flex-wrap gap-2">

        </div>
      </div>

        <div className="flex justify-center py-20">
          <div className="w-8 h-8 border-4 border-muted border-t-primary rounded-full animate-spin" />
        </div>
        <div className="text-center py-20">
          <MoonAvatar variant="casual" size="md" speech="Nenhum curso encontrado... tente outra busca! 🔍" />
        </div>
        <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-5">
            <CourseCard
              key={course.id}
              course={course}
              index={i}
              completedLessons={progress[course.id] || 0}
            />
        </div>
    </div>
</body>
</html>
