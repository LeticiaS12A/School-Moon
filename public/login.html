<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Moon | Login</title>

    <script src="./js/login.js"></script>
    <link rel="stylesheet" href="./css/estilo.css">
    <link rel="stylesheet" href="./css/login.css">
</head>
<body class="body-login">
    <header>
        <div class="container-header">
            <div>
                <p class="titulo-projeto">School Moon</p>
            </div>
            <nav class="btn-navs">
                <a href="index.html" class="navs-acesso">Inicial</a>
                <a href="#"class="acesso-atual">Login</a>
                <a href="cadastro.html" class="navs-acesso">Cadastro</a>
            </nav>
        </div>
    </header>
    <div class="alerta_erro">
      <div class="card_erro" id="cardErro">
        <span id="fechar" onclick="sumirMensagem()">&times;</span>
        <span id="mensagem_erro"></span>
      </div>
    </div>
    <section class="card">
      <div class="forms">
        <form id="login-form" class="form">
          <h2>Login</h2>

          <input type="email" name="impemail" id="email_input" placeholder="Email" autocomplete="email" />
          
          <input type="password" name="impsenha" id="senha_input" placeholder="Senha" autocomplete="current-password" />
          
          <button type="button" id="btdlogin" onclick="entrar()">Entrar</button>
        </form>
        <p class="sem-cadastro">Não tenho cadastro!   <a href="cadastro.html">Cadastrar-se</a></p>
      </div>
  </section>
    <footer>
        <div class="container-footer">
            <div class="footer-nav">
                <p class="footer-titulo">School Moon</p>
                <div class="footer-navs">
                    <a href="login.html" class="navs-footer">Cursos</a>
                    <a href="https://github.com/LeticiaS12A" class="navs-footer">Sobre-nos</a>
                </div>
                <p class="direitos">Feito por <a href="https://github.com/LeticiaS12A">LeticiaS12A</a></p>
            </div>
            <div>
                <p class="creditos">© 2026 School Moon — Educação gratuita e acessível para todos.</p>
            </div>
        </div>
    </footer>
</body>
</html>
