<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Moon | Aula</title>
    <link rel="stylesheet" href="./css/estilo.css">
    <link rel="stylesheet" href="./css/conteudo.css">
</head>
<body onload="carregarPagina()">

    <header>
        <div class="container-header">
            <p class="titulo-projeto">School Moon - <span id="span_nome_curso">Curso</span></p>
            <div class="progresso-bar-container">
                <div id="barra_progresso" class="progresso-fecho" style="width: 0%;"></div>
            </div>
            <button onclick="sair()" class="btn-sair">Sair do curso</button>
        </div>
    </header>

    <main class="conteudo-principal">
        <div class="card-aula">
            <h2 id="titulo_aula">Carregando...</h2>
            <div id="texto_aula" class="texto-aula">
                <!-- O conteúdo será injetado aqui pelo JS -->
            </div>

            <div class="navegacao">
                <button id="btn_proximo" onclick="avancarPagina()">Próxima Página (20%)</button>
                <button id="btn_concluir" onclick="concluirCurso()" style="display: none;">Concluir Curso</button>
            </div>
        </div>
    </main>

    <footer>
        <div class="container-footer">
            <div class="footer-nav">
                <p class="footer-titulo">School Moon</p>
                <div class="footer-navs">
                    <a href="login.html" class="navs-footer">Cursos</a>
                    <a href="sobre.html" class="navs-footer">Sobre-nos</a>
                </div>
                <p class="direitos">Feito por <a href="https://github.com/LeticiaS12A">LeticiaS12A</a></p>
            </div>
            <div>
                <p class="creditos">© 2026 School Moon — Educação gratuita e acessível para todos.</p>
            </div>
            
        </div>
    </footer>
</body>
</html>
<script>

    var paginaAtual = 1;
    var progressoAtual = 0;

    var idUsuario = sessionStorage.ID_USUARIO;
    var idCurso = sessionStorage.ID_CURSO_ATUAL;

    /* ======================================================
       CONTEÚDOS DO CURSO
    ====================================================== */

    var aulas = {

        1: [
            "Introdução ao Desenvolvimento Web",

            `
            <h3>O que é Desenvolvimento Web?</h3>

            <p>
                Desenvolvimento Web é a criação de sites, sistemas e aplicações
                que funcionam através da internet.
            </p>

            <p>
                Tudo que você acessa no navegador foi desenvolvido utilizando
                tecnologias web.
            </p>

            <h3>Principais tecnologias</h3>

            <ul>
                <li>HTML → estrutura do site</li>
                <li>CSS → aparência e design</li>
                <li>JavaScript → interatividade</li>
            </ul>

            <p>
                Durante este curso você aprenderá como essas tecnologias
                trabalham juntas.
            </p>
            `
        ],

        2: [
            "Aprendendo HTML",

            `
            <h3>O que é HTML?</h3>

            <p>
                HTML significa HyperText Markup Language.
            </p>

            <p>
                Ele é responsável por estruturar os elementos da página.
            </p>

            <h3>Exemplo de estrutura</h3>

            <pre>
&lt;h1&gt;Título&lt;/h1&gt;
&lt;p&gt;Texto da página&lt;/p&gt;
            </pre>

            <h3>Tags importantes</h3>

            <ul>
                <li>&lt;h1&gt; → título</li>
                <li>&lt;p&gt; → parágrafo</li>
                <li>&lt;img&gt; → imagem</li>
                <li>&lt;a&gt; → link</li>
            </ul>

            <p>
                O HTML é a base de qualquer site.
            </p>
            `
        ],

        3: [
            "Estilizando com CSS",

            `
            <h3>O que é CSS?</h3>

            <p>
                CSS é utilizado para estilizar os elementos do HTML.
            </p>

            <p>
                Com ele podemos alterar:
            </p>

            <ul>
                <li>Cores</li>
                <li>Tamanhos</li>
                <li>Espaçamentos</li>
                <li>Animações</li>
                <li>Layouts</li>
            </ul>

            <h3>Exemplo</h3>

            <pre>
h1{
    color: purple;
    font-size: 40px;
}
            </pre>

            <p>
                O CSS deixa os sites modernos e visualmente agradáveis.
            </p>
            `
        ],

        4: [
            "Interatividade com JavaScript",

            `
            <h3>O que é JavaScript?</h3>

            <p>
                JavaScript adiciona interatividade ao site.
            </p>

            <p>
                Ele permite:
            </p>

            <ul>
                <li>Criar animações</li>
                <li>Validar formulários</li>
                <li>Modificar elementos</li>
                <li>Consumir APIs</li>
                <li>Criar jogos e sistemas</li>
            </ul>

            <h3>Exemplo simples</h3>

            <pre>
alert("Olá mundo!");
            </pre>

            <p>
                Hoje o JavaScript é uma das linguagens mais utilizadas do mundo.
            </p>
            `
        ],

        5: [
            "Projeto Final",

            `
            <h3>Hora de praticar!</h3>

            <p>
                Agora você utilizará HTML, CSS e JavaScript juntos.
            </p>

            <h3>Desafio</h3>

            <p>
                Crie uma página contendo:
            </p>

            <ul>
                <li>Um título</li>
                <li>Uma imagem</li>
                <li>Botões estilizados</li>
                <li>Uma interação com JavaScript</li>
            </ul>

            <h3>Dicas</h3>

            <ul>
                <li>Use cores harmoniosas</li>
                <li>Organize o código</li>
                <li>Teste no navegador</li>
            </ul>

            <p>
                Parabéns por chegar até aqui! 🚀
            </p>
            `
        ]
    };

    /* ======================================================
       FUNÇÕES
    ====================================================== */

    function carregarPagina() {

        span_nome_curso.innerHTML =
            sessionStorage.NOME_CURSO_ATUAL;

        atualizarInterface();
    }

    function atualizarInterface() {

        titulo_aula.innerHTML =
            aulas[paginaAtual][0];

        texto_aula.innerHTML =
            aulas[paginaAtual][1];

        progressoAtual =
            (paginaAtual - 1) * 20;

        barra_progresso.style.width =
            progressoAtual + "%";

        if (paginaAtual == 5) {

            btn_proximo.style.display = "none";
            btn_concluir.style.display = "block";
        }
    }

    function avancarPagina() {

        paginaAtual++;

        var novoProgresso =
            (paginaAtual - 1) * 20;

        enviarProgresso(novoProgresso);

        atualizarInterface();
    }

    function enviarProgresso(valor) {

        fetch(`/usuarios/atualizarProgresso/${idUsuario}/${idCurso}`, {

            method: "PUT",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                progressoServer: valor
            })

        }).then(res => {

            if (!res.ok) {
                console.log("Erro ao salvar progresso");
            }

        });
    }

    function concluirCurso() {

        enviarProgresso(100);

        alert("Parabéns! Curso concluído com sucesso.");

        window.location = "cursos.html";
    }

    function sair() {

        window.location = "cursos.html";
    }

</script>
