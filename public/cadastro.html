<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>School Moon</title>

  <script src="./js/sessao.js"></script>

  <link rel="stylesheet" href="./css/estilo.css" />
  <link rel="stylesheet" href="./css/cadastro.css">
  <link rel="icon" href="./assets/icon/favicon2.ico" />
  <link rel="preconnect" href="https://fonts.gstatic.com" />
</head>

<body onload="listar()">
  <!--header inicio-->
  <header>
      <div class="container-header">
          <div>
              <p class="titulo-projeto">School Moon</p>
          </div>
          <nav class="btn-navs">
              <a href="index.html" class="navs-acesso">Inicial</a>
              <a href="sobre.html" class="navs-acesso">Sobre-nos</a>
              <a href="login.html"class="navs-acesso">Login</a>
              <a href="#" class="acesso-atual">Cadastro</a>
          </nav>
      </div>
  </header>
  <!--header fim-->

  <div class="alerta_erro"> <!--Card de erro modal(ou seja esta oculto até ser chamado)-->
    <div class="card_erro" id="cardErro">
      <span id="fechar" onclick="sumirMensagem()">&times;</span><!--X para fechar o card de erro-->
      <span id="mensagem_erro"></span><!--Mensagem de erro que muda de acordo com os IFs do script-->
    </div>
  </div>

  <section class="card"> <!--Card principal da tela-->
    <div class="forms">
      <form id="login-form" class="form"> <!--Tag de inicio do formulario do cadastro-->
        <h2>Cadastre-se aqui!</h2>
        <input type="text" id="nome_completo" placeholder="Nome Completo">
        <input type="password" id="senha_imp" placeholder="Senha">
        <input type="password" id="confirmar_senha" placeholder="Confirmar Senha">
        <input type="email" id="email" placeholder="Email">

        <button type="button" onclick="cadastrar()">Cadastrar</button><!--botao de envio do cadastro-->
      </form>
        <p class="com-cadastro">Já possuo conta!  <a href="login.html">Fazer Login</a></p>
    </div>
  </section>

  <!--footer inicio-->
  <footer>
        <div class="container-footer">
            <div class="footer-nav">
                <p class="footer-titulo">School Moon</p>
                <div class="footer-navs">
                    <a href="login.html" class="navs-footer">Cursos</a>
                    <a href="sobre.html" class="navs-footer">Sobre-nos</a>
                </div>
                <p class="creditos">Feito por <a href="https://github.com/LeticiaS12A">LeticiaS12A</a></p>
            </div>
            <div>
                <p class="creditos">© 2026 School Moon — Educação gratuita e acessível para todos.</p>
            </div>
            
        </div>
    </footer>
  <!--footer fim-->
</body>

</html>

<script src="./js/cadastro.js"></script>
