<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>School Moon</title>

  <script src="./js/sessao.js"></script>

  <link rel="stylesheet" href="./css/estilo.css" />
  <link rel="stylesheet" href="./css/cadastro.css">
  <link rel="icon" href="./assets/icon/favicon2.ico" />
  <link rel="preconnect" href="https://fonts.gstatic.com" />
</head>

<body class="body-cadastro">
  <!--header inicio-->
  <header>
      <div class="container-header">
          <div>
              <p class="titulo-projeto">School Moon</p>
          </div>
          <nav class="btn-navs">
              <a href="index.html" class="navs-acesso">Inicial</a>
              <a href="sobre.html" class="navs-acesso">Sobre-nos</a>
              <a href="login.html" class="navs-acesso">Login</a>
              <a href="#" class="acesso-atual">Cadastro</a>
          </nav>
      </div>
  </header>
  <!--header fim-->

  <div class="alerta_erro"> 
    <div class="card_erro" id="cardErro" style="display: none;">
      <span id="fechar" onclick="sumirMensagem()">&times;</span>
      <span id="mensagem_erro"></span>
    </div>
  </div>

  <section class="card"> 
    <div class="forms">
      <form id="login-form" class="form"> 
        <h2>Cadastre-se aqui!</h2>
        <input type="text" id="nome_completo" placeholder="Nome Completo">
        <input type="password" id="senha_imp" placeholder="Senha">
        <input type="password" id="confirmar_senha" placeholder="Confirmar Senha">
        <input type="email" id="email" placeholder="Email">

        <button type="button" onclick="cadastrar()">Cadastrar</button>
      </form>
        <p class="com-cadastro">Já possuo conta!  <a href="login.html">Fazer Login</a></p>
    </div>
  </section>

  <footer>
        <div class="container-footer">
            <div class="footer-nav">
                <p class="footer-titulo">School Moon</p>
                <div class="footer-navs">
                    <a href="login.html" class="navs-footer">Cursos</a>
                    <a href="sobre.html" class="navs-footer">Sobre-nos</a>
                </div>
                <p class="direitos">Feito por <a href="https://github.com/LeticiaS12A">LeticiaS12A</a></p>
            </div>
            <div>
                <p class="creditos">© 2026 School Moon — Educação gratuita e acessível para todos.</p>
            </div>
            
        </div>
    </footer>

  <script>
    function cadastrar() {
      // Usando os IDs exatos do seu novo HTML
      var nomeVar = nome_completo.value.trim();
      var emailVar = email.value.trim();
      var senhaVar = senha_imp.value.trim();
      var confirmacaoSenhaVar = confirmar_senha.value.trim();

      if (nomeVar == "" || emailVar == "" || senhaVar == "" || confirmacaoSenhaVar == "") {
        cardErro.style.display = "block";
        mensagem_erro.innerHTML = "Preencha todos os campos.";
        return false;
      }

      if (emailVar.indexOf("@") == -1 || emailVar.indexOf(".") == -1) {
        cardErro.style.display = "block";
        mensagem_erro.innerHTML = "Email inválido.";
        return false;
      }

      if (senhaVar != confirmacaoSenhaVar) {
        cardErro.style.display = "block";
        mensagem_erro.innerHTML = "As senhas não coincidem.";
        return false;
      }

      fetch("/usuarios/cadastrar", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          nomeServer: nomeVar,
          emailServer: emailVar,
          senhaServer: senhaVar
        }),
      })
        .then(function (resposta) {
          if (resposta.ok) {
            cardErro.style.display = "block";
            mensagem_erro.innerHTML = "Cadastro realizado com sucesso! Redirecionando...";

            setTimeout(() => {
              window.location = "login.html";
            }, 2000);
          } else {
            throw "Houve um erro ao tentar realizar o cadastro!";
          }
        })
        .catch(function (erro) {
          console.log(`#ERRO: ${erro}`);
        });

      return false;
    }

    function sumirMensagem() {
      cardErro.style.display = "none";
    }
  </script>
</body>
</html>
